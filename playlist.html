<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Playlists 🎵</title>

  <!-- SKRIP PROTEKSI INSTAN -->
  <script>
    if (sessionStorage.getItem('unlocked') !== 'true') {
      window.location.replace("lock.html");
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: none;" id="main-body">

  <!-- Top Fixed Navigation Bar -->
  <header class="top-nav-fixed">
    <div class="nav-left">
      <a href="index.html" class="nav-btn">⬅️ Kembali</a>
    </div>
    <div class="nav-right">
      <button class="icon-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button>
    </div>
  </header>

  <!-- Container Konten Utama -->
  <div class="app-card memory-card-wide">
    <h1 class="title-serif">Music Playlists 🎧✨</h1>
    <p class="subtitle">Kumpulan playlist Spotify favorit untuk didengarkan bersama.</p>

    <!-- KOTAK INPUT TAMBAH PLAYLIST SPOTIFY -->
    <div class="playlist-input-card">
      <label class="input-label">
        ➕ Tempelkan Link / URL Playlist Spotify Di Sini:
      </label>
      <div class="input-group">
        <input 
          type="text" 
          id="spotify-url-input" 
          placeholder="Contoh: https://open.spotify.com/playlist/..."
          autocomplete="off"
        />
        <button class="btn-primary-small" onclick="addSpotifyPlaylist()">
          ✨ Tambahkan
        </button>
      </div>
      <p class="input-hint">
        💡 *Buka Spotify > Pilih Playlist > Klik Titik Tiga (...) > Bagikan > Salin Tautan Playlist.*
      </p>
    </div>

    <!-- GRID TEMPAT WIDGET PLAYLIST SPOTIFY -->
    <div class="playlists-grid" id="playlists-container">
      <!-- Widget Playlist Spotify akan terisi secara otomatis via JS -->
    </div>

    <!-- FOOTER COPYRIGHT BY RAIHAN -->
    <footer style="margin-top: 30px; padding-top: 15px; border-top: 1px dashed var(--surface-border); font-size: 0.8rem; color: var(--text-sub); text-align: center;">
      Made with 💖 for Chelsa Jo Agatha<br>
      <span style="font-weight: 600; color: var(--accent-pink); letter-spacing: 0.5px;">Copyright © 2026 by Raihan</span>
    </footer>
  </div>

  <script src="script.js"></script>
  <script>
    if (sessionStorage.getItem('unlocked') === 'true') {
      document.getElementById('main-body').style.display = 'flex';
    }

    // MATIKAN MUSIK BACKGROUND KHUSUS DI HALAMAN PLAYLIST
    localStorage.setItem('audio_playing', 'true');

    const DEFAULT_PLAYLISTS = [
      "https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M"
    ];

    function getSavedPlaylists() {
      const saved = localStorage.getItem('spotify_playlists');
      return saved ? JSON.parse(saved) : DEFAULT_PLAYLISTS;
    }

    function extractSpotifyId(url) {
      const match = url.match(/playlist\/([a-zA-Z0-9]+)/);
      return match ? match[1] : null;
    }

    function renderPlaylists() {
      const container = document.getElementById('playlists-container');
      const playlists = getSavedPlaylists();

      if (!container) return;
      container.innerHTML = "";

      if (playlists.length === 0) {
        container.innerHTML = `<p style="color: var(--text-sub); font-size: 0.9rem; grid-column: 1/-1;">Belum ada playlist yang ditambahkan. Tempelkan link Spotify di atas!</p>`;
        return;
      }

      playlists.forEach((url, index) => {
        const playlistId = extractSpotifyId(url);
        if (!playlistId) return;

        const card = document.createElement('div');
        card.className = 'spotify-embed-card';
        card.innerHTML = `
          <button class="remove-playlist-btn" onclick="removePlaylist(${index})" title="Hapus Playlist">✕</button>
          <iframe 
            style="border-radius:18px" 
            src="https://open.spotify.com/embed/playlist/${playlistId}?utm_source=generator&theme=0" 
            width="100%" 
            height="380" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
          </iframe>
        `;
        container.appendChild(card);
      });
    }

    function addSpotifyPlaylist() {
      const input = document.getElementById('spotify-url-input');
      const url = input ? input.value.trim() : "";

      if (!url) {
        alert("Tempelkan link playlist Spotify terlebih dahulu yaa!");
        return;
      }

      const playlistId = extractSpotifyId(url);
      if (!playlistId) {
        alert("URL Spotify tidak valid! Pastikan linknya berformat playlist (contoh: https://open.spotify.com/playlist/...)");
        return;
      }

      const playlists = getSavedPlaylists();
      if (playlists.includes(url)) {
        alert("Playlist ini sudah ada di dalam daftar!");
        return;
      }

      playlists.unshift(url);
      localStorage.setItem('spotify_playlists', JSON.stringify(playlists));
      input.value = "";
      renderPlaylists();
    }

    function removePlaylist(index) {
      if (confirm("Yakin mau menghapus playlist ini dari daftar?")) {
        const playlists = getSavedPlaylists();
        playlists.splice(index, 1);
        localStorage.setItem('spotify_playlists', JSON.stringify(playlists));
        renderPlaylists();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPlaylists();
    });
  </script>
</body>
</html>
