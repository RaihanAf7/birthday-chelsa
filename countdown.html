<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Counting Down...</title>
  
  <script>
    if (sessionStorage.getItem('unlocked') !== 'true') {
      window.location.replace("lock.html");
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-locked-page">

  <div class="top-nav">
    <button class="nav-btn" onclick="relockPage()">🔒 Kembali ke Lock</button>
    <button class="icon-btn" onclick="toggleTheme()"><span id="theme-icon">🌙</span></button>
  </div>

  <div class="app-card">
    <h1 class="title-serif">Something Special Is Coming</h1>
    <p class="subtitle">Hitung mundur menuju hari ulang tahunmu.</p>

    <!-- Timer Grid -->
    <div class="timer-grid">
      <div class="time-box"><span class="num" id="days">00</span><span class="label">Hari</span></div>
      <div class="time-box"><span class="num" id="hours">00</span><span class="label">Jam</span></div>
      <div class="time-box"><span class="num" id="minutes">00</span><span class="label">Menit</span></div>
      <div class="time-box"><span class="num" id="seconds">00</span><span class="label">Detik</span></div>
    </div>

    <!-- Tombol Akses Halaman Utama -->
    <button class="btn-primary" id="open-btn" onclick="handleOpenClick()">
      ✨ Buka Kejutan
    </button>
  </div>

  <!-- Modal / Pop-up Notifikasi Belum Waktunya -->
<div class="notice-modal-overlay" id="notice-modal" onclick="closeModal(event)">
  <div class="notice-modal-card">
    <div style="font-size: 2.8rem; margin-bottom: 10px;">⏳</div>
    <h3 style="font-size: 1.3rem; font-weight: 600; color: var(--accent-pink); margin-bottom: 8px;">Belum Waktunya!</h3>
    <p style="font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 20px;">
      Sabar yaa... Kejutan ini baru bisa dibuka pada tanggal <strong>19 Oktober 2026</strong>. Tunggu sampai hitungan mundurnya selesai! ✨
    </p>
    <button class="btn-primary" onclick="closeModal()">Okee</button>
  </div>
</div>

  <script src="script.js"></script>
  <script>
    checkAuth();
    const TARGET_DATE = '2026-10-19T00:00:00';
    startCountdown(TARGET_DATE);
  </script>
</body>
</html>
